[build-system]
requires = ["hatchling>=1.25", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "vtk2cesium"
version = "0.1.0.dev0"
description = "Experimental VTK to CesiumJS voxel tiles converter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "vtk2Cesium contributors" }]
dependencies = [
  "numpy>=2.0",
  "vtk>=9.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
conversion = [
  "pyproj>=3.7",
]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[project.scripts]
vtk2cesium = "vtk2cesium.cli:main"
vtk2cesium-probe = "vtk2cesium.probe:main"
vtk2cesium-validate = "vtk2cesium.validate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vtk2cesium"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["vtk2cesium"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
